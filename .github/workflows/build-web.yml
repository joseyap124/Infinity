name: Build prototipe web (iPhone)

# Versi web Infinity untuk dicoba di iPhone/iPad lewat browser.
# Fitur khusus Android (catat otomatis, widget, pintasan notifikasi) tidak ada.
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - '.github/workflows/build-web.yml'
      - 'tool/web_prototype.py'
      - 'tool/ci_setup.sh'
      - 'tool/versions.env'
      - 'tool/pubspec.lock'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Baca versi yang dikunci
        run: grep -E '^[A-Z_]+=' tool/versions.env >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Siapkan proyek web + paket
        run: bash tool/ci_setup.sh web

      - name: Build web
        shell: bash
        run: |
          set -o pipefail
          flutter build web --release --no-web-resources-cdn \
            --dart-define=APP_VERSION=web 2>&1 | tee "$RUNNER_TEMP/build.txt"
          python3 tool/web_prototype.py build/web
          cd build/web && zip -qr "$GITHUB_WORKSPACE/infinity-web.zip" .

      - name: Terbitkan di Releases (tag web-prototype)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: web-prototype
          name: Infinity prototipe web (iPhone)
          prerelease: true
          body: |
            Versi web Infinity untuk dicoba di iPhone lewat browser (Safari > Bagikan > Tambah ke Layar Utama).
            Fitur khusus Android (catat otomatis dari notifikasi, widget, pintasan notifikasi, backup ke Download) tidak tersedia.
            Commit ${{ github.sha }}
          files: infinity-web.zip
          overwrite_files: true

      - name: Simpan log kegagalan
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP"/*.txt "$RUNNER_TEMP/logs/" 2>/dev/null || true
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name ci && git config user.email ci@localhost
          echo "web run ${{ github.run_number }} commit ${{ github.sha }}" > info.txt
          git add -A && git commit -qm "log web run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs
