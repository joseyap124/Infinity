name: Tes branch (tanpa rilis)

# Untuk branch selain main: jalankan tes + analyze + kompilasi web, tanpa
# menerbitkan APK. Hasil (log, pubspec.lock, versi Flutter) disimpan di
# branch ci-out supaya bisa dibaca dari luar.
on:
  push:
    branches-ignore: [main, ci-logs, ci-out]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Baca versi yang dikunci
        run: grep -E '^[A-Z_]+=' tool/versions.env >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Siapkan proyek
        shell: bash
        run: |
          set -o pipefail
          bash tool/ci_setup.sh android 2>&1 | tee "$RUNNER_TEMP/setup.txt"

      - name: Tes
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/test.txt"

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze lib --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/analyze.txt"

      - name: Simpan hasil ke branch ci-out
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP"/*.txt "$RUNNER_TEMP/out/" 2>/dev/null || true
          cp pubspec.lock "$RUNNER_TEMP/out/pubspec.lock" 2>/dev/null || true
          flutter --version --machine > "$RUNNER_TEMP/out/flutter.json" 2>/dev/null || true
          echo "branch ${{ github.ref_name }} run ${{ github.run_number }} commit ${{ github.sha }} status ${{ job.status }}" > "$RUNNER_TEMP/out/info.txt"
          cd "$RUNNER_TEMP/out"
          git init -q
          git config user.name ci && git config user.email ci@localhost
          git add -A && git commit -qm "ci-out ${{ github.ref_name }} ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-out
