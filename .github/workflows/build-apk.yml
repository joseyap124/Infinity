name: Build APK Infinity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan proyek Flutter + paket
        run: |
          flutter --version
          flutter create --org com.jose --project-name infinity --platforms android .
          rm -rf test
          flutter pub add intl flutter_secure_storage local_auth flutter_local_notifications timezone home_widget
          python3 tool/setup_android.py

      # Kunci tanda tangan tetap (opsional tapi sangat disarankan): tanpa ini,
      # setiap build punya tanda tangan berbeda, jadi update harus uninstall dulu
      # dan DATA DI HP IKUT HILANG. Isi secret DEBUG_KEYSTORE_BASE64 sekali saja.
      - name: Pakai keystore tetap (kalau ada)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Keystore tetap dipakai (secret)"
          elif [ -f tool/infinity.keystore ]; then
            cp tool/infinity.keystore ~/.android/debug.keystore
            echo "Keystore tetap dipakai (tool/infinity.keystore)"
          else
            echo "PERINGATAN: secret DEBUG_KEYSTORE_BASE64 belum diisi"
          fi

      - name: Cek kode (analyze)
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Ganti nama APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Infinity.apk

      - uses: actions/upload-artifact@v4
        with:
          name: infinity-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Terbitkan APK di halaman Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Infinity build ${{ github.run_number }}
          body: Pasang Infinity.apk di HP Android.
          files: Infinity.apk
