name: Build APK Infinity

on:
  push:
    branches: [main]
    # Perubahan dokumentasi saja tidak perlu build APK baru.
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/release-notes.yml'
      - '.github/workflows/build-web.yml'
      - 'tool/web_prototype.py'
      - 'tool/release_notes.py'
      - 'docs/**'
      - 'tool/mockup/**'
      - 'tool/make_icons.py'
  workflow_dispatch:

permissions:
  contents: write

# Satu build sekaligus, supaya nomor versi tidak bentrok.
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Baca versi yang dikunci
        run: grep -E '^[A-Z_]+=' tool/versions.env >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Siapkan proyek Flutter + paket
        run: bash tool/ci_setup.sh android

      # Kunci tanda tangan tetap (opsional tapi sangat disarankan): tanpa ini,
      # setiap build punya tanda tangan berbeda, jadi update harus uninstall dulu
      # dan DATA DI HP IKUT HILANG. Isi secret DEBUG_KEYSTORE_BASE64 sekali saja.
      - name: Pakai keystore tetap (kalau ada)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/infinity.keystore"
            keytool -list -keystore "$RUNNER_TEMP/infinity.keystore" -storepass android -alias androiddebugkey > /dev/null \
              || { echo "::error::Secret DEBUG_KEYSTORE_BASE64 tidak valid"; exit 1; }
            echo "INFINITY_KEYSTORE=$RUNNER_TEMP/infinity.keystore" >> "$GITHUB_ENV"
            echo "Keystore tetap dipakai"
          else
            echo "::warning::secret DEBUG_KEYSTORE_BASE64 belum diisi, APK ditandatangani kunci acak"
          fi

      - name: Tes otomatis (hitungan uang, import, backup)
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/test.txt"

      - name: Cek kode (analyze)
        shell: bash
        run: |
          set -o pipefail
          flutter analyze lib --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/analyze.txt"

      # Versi naik 1 dari rilis terakhir: v1.6 -> v1.7, v2.0 -> v2.1, ...
      # (build yang gagal tidak memakan nomor).
      - name: Tentukan nomor versi
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(gh release list -R "${{ github.repository }}" --limit 200 --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+$")) | ltrimstr("v") | split(".") | map(tonumber)] | (max // [1,0]) | "\(.[0]).\(.[1] + 1)"')
          # Versi bisa ditentukan manual di CHANGELOG.md: "## Berikutnya (v1.3.1)"
          WANT=$(grep -m1 -oP '^## Berikutnya \(v\K[0-9]+\.[0-9]+(\.[0-9]+)?(?=\))' CHANGELOG.md || true)
          if [ -n "$WANT" ] && ! gh release view "v$WANT" -R "${{ github.repository }}" >/dev/null 2>&1; then V="$WANT"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          python3 tool/release_notes.py next "$V" "$(git log -1 --pretty=%s)" > "$RUNNER_TEMP/notes.md"
          echo "Versi baru: $V"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION=${{ steps.ver.outputs.version }} 2>&1 | tee "$RUNNER_TEMP/build.txt"

      - name: Ganti nama APK
        run: |
          V=${{ steps.ver.outputs.version }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "Infinity-v$V.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "Infinity-v$V-hp-lama-32bit.apk"

      - name: Pastikan APK tanpa izin internet + library rata 16 KB
        shell: bash
        run: |
          set -o pipefail
          python3 tool/check_apk.py Infinity*.apk | tee -a "$RUNNER_TEMP/build.txt"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for f in Infinity*.apk; do
            "$AAPT" dump permissions "$f" | tee -a "$RUNNER_TEMP/build.txt"
            if "$AAPT" dump permissions "$f" | grep -q "android.permission.INTERNET"; then
              echo "GAGAL: $f punya izin INTERNET" | tee -a "$RUNNER_TEMP/build.txt"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infinity-apk
          path: Infinity*.apk

      - name: Terbitkan APK di halaman Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Infinity v${{ steps.ver.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            Infinity-v${{ steps.ver.outputs.version }}.apk
            Infinity-v${{ steps.ver.outputs.version }}-hp-lama-32bit.apk

      # Kalau gagal, simpan log ke branch ci-logs supaya bisa dibaca lewat git.
      - name: Simpan log kegagalan
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP"/*.txt "$RUNNER_TEMP/logs/" 2>/dev/null || true
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name ci && git config user.email ci@localhost
          echo "run ${{ github.run_number }} commit ${{ github.sha }}" > info.txt
          git add -A && git commit -qm "log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs
