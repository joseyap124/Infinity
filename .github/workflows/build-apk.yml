name: Build APK Infinity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan proyek Flutter + paket
        run: |
          flutter --version
          flutter create --org com.jose --project-name infinity --platforms android .
          rm -rf test
          flutter pub add intl flutter_secure_storage local_auth flutter_local_notifications timezone home_widget image_picker path_provider archive
          python3 tool/setup_android.py

      # Kunci tanda tangan tetap (opsional tapi sangat disarankan): tanpa ini,
      # setiap build punya tanda tangan berbeda, jadi update harus uninstall dulu
      # dan DATA DI HP IKUT HILANG. Isi secret DEBUG_KEYSTORE_BASE64 sekali saja.
      - name: Pakai keystore tetap (kalau ada)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/infinity.keystore"
            keytool -list -keystore "$RUNNER_TEMP/infinity.keystore" -storepass android -alias androiddebugkey > /dev/null \
              || { echo "::error::Secret DEBUG_KEYSTORE_BASE64 tidak valid"; exit 1; }
            echo "INFINITY_KEYSTORE=$RUNNER_TEMP/infinity.keystore" >> "$GITHUB_ENV"
            echo "Keystore tetap dipakai"
          else
            echo "::warning::secret DEBUG_KEYSTORE_BASE64 belum diisi, APK ditandatangani kunci acak"
          fi

      - name: Cek kode (analyze)
        shell: bash
        run: |
          set -o pipefail
          flutter analyze lib --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/analyze.txt"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee "$RUNNER_TEMP/build.txt"

      - name: Ganti nama APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Infinity.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Infinity-hp-lama-32bit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: infinity-apk
          path: Infinity*.apk

      - name: Terbitkan APK di halaman Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Infinity build ${{ github.run_number }}
          body: Pasang Infinity.apk di HP Android. Infinity-hp-lama-32bit.apk hanya untuk HP lama yang tidak bisa memasang versi biasa.
          files: |
            Infinity.apk
            Infinity-hp-lama-32bit.apk

      # Kalau gagal, simpan log ke branch ci-logs supaya bisa dibaca lewat git.
      - name: Simpan log kegagalan
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP"/*.txt "$RUNNER_TEMP/logs/" 2>/dev/null || true
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name ci && git config user.email ci@localhost
          echo "run ${{ github.run_number }} commit ${{ github.sha }}" > info.txt
          git add -A && git commit -qm "log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs
